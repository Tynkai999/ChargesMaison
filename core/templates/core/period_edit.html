{% extends "core/base.html" %}
{% block title %}Modifier {{ period }}{% endblock %}
{% block breadcrumb %}<a href="{% url 'period_list' %}">Périodes</a> <span class="separator"><i class="bi bi-chevron-right"></i></span> <span class="current">{{ period }}</span>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-pencil" style="color: var(--primary);"></i>
                Modifier {{ period }}
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.annee.label }}</label>
                        {{ form.annee }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.mois.label }}</label>
                        {{ form.mois }}
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" name="cloturee" id="cloturee" {% if period.cloturee %}checked{% endif %}>
                        <label class="form-check-label" for="cloturee">Période clôturée</label>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Enregistrer</button>
                        <a href="{% url 'period_detail' period.pk %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
