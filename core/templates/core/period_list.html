{% extends "core/base.html" %}
{% block title %}Périodes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-calendar3"></i> Périodes</h2>
    <a href="{% url 'period_add' %}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nouvelle période</a>
</div>
<div class="card">
    <div class="list-group list-group-flush">
        {% for period in periods %}
            <a href="{% url 'period_detail' period.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ period }}
                {% if period.cloturee %}<span class="badge bg-secondary">Clôturée</span>{% endif %}
            </a>
        {% empty %}
            <div class="list-group-item text-muted">Aucune période pour le moment.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
