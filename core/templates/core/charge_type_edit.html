{% extends "core/base.html" %}
{% block title %}Modifier un type de charge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3"><i class="bi bi-pencil"></i> Modifier « {{ charge_type.nom }} »</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-2">
                    <label class="form-label">{{ form.nom.label }}</label>
                    {{ form.nom }}
                </div>
                <div class="form-check mb-2">
                    {{ form.est_loyer }}
                    <label class="form-check-label">{{ form.est_loyer.label }}</label>
                </div>
                <div class="form-check mb-2">
                    {{ form.est_wifi }}
                    <label class="form-check-label">{{ form.est_wifi.label }}</label>
                </div>
                <button type="submit" class="btn btn-primary mt-2">Enregistrer</button>
                <a href="{% url 'charge_type_list' %}" class="btn btn-link mt-2">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
